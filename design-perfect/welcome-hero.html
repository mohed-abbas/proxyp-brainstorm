<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy Papers — Welcome → Hero</title>

    <!-- Preload the heavy first-paint assets so the network fetch starts before the
         parser reaches them — the JS asset-gate then resolves sooner on a cold load. -->
    <link
      rel="preload"
      as="image"
      href="assets/hero-bg.webp"
      fetchpriority="high"
    />
    <link
      rel="preload"
      as="font"
      type="font/woff"
      href="assets/fonts/ppneuemontreal-book.woff"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff"
      href="assets/fonts/ppneuemontreal-bold.woff"
      crossorigin
    />

    <!-- Mark JS-capable before first paint so we can arm the welcome state without
         ever flashing the resolved hero. If JS is off, the page renders the hero. -->
    <script>
      document.documentElement.classList.add("js");
    </script>

    <!-- GSAP + ScrollTrigger (CDN) -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      defer
    ></script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"
      defer
    ></script>
    <!-- Lenis smooth scroll — normalises scroll into rAF-interpolated deltas so
         Firefox's chunky native scroll matches Chrome's smoothness. -->
    <script
      src="https://cdn.jsdelivr.net/npm/lenis@1.1.18/dist/lenis.min.js"
      defer
    ></script>

    <style>
      /* PP Neue Montreal — the brand typeface (commercial, Pangram Pangram).
         Book → 400, Bold → 700. Medium (500) isn't provided, so the marquee's
         500 falls back to Book via CSS font-matching. */
      @font-face {
        font-family: "PP Neue Montreal";
        src: url("assets/fonts/ppneuemontreal-book.woff") format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "PP Neue Montreal";
        src: url("assets/fonts/ppneuemontreal-bold.woff") format("woff");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }

      :root {
        /* Brand palette */
        --bone-white: #f7f4f0; /* warm off-white */
        --ink: #161718; /* Chinese Black */
        --proxy-blue: #5a90f4; /* accent — the P-mark blade */
        --hairline-track: #b9b9b9;

        /* Two scaling units that stay locked to each other:
           - the lockup (welcome): 51.75vw, clamps at 783px
           - the card (hero):      68.43vw, clamps at 1034.69px
           51.75 / 68.43 = 0.7563 = the lockup's width as a fraction of the card,
           so the persistent logo overlay and the card track each other as they scale. */
        --lock-w: clamp(280px, 51.75vw, 783px);
        --card-w: min(68.43vw, 1034.69px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      /* Lenis smooth-scroll base styles (from the library's recommended CSS) */
      html.lenis,
      html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        background: var(--bone-white);
        font-family:
          "PP Neue Montreal", "Neue Haas Grotesk", "Inter", system-ui,
          sans-serif;
      }
      /* Once the intro resolves, the page ground goes ink so everything past the
         hero (and the expanded card) is the dark canvas. Applied via a body class
         at intro completion so the no-JS / reduced-motion fallback stays bone white. */
      body.is-dark {
        background: var(--ink);
      }

      /* Hero stage — one viewport tall, the ScrollTrigger PIN target. Relative (not
         fixed) so it can be pinned; children stay position:absolute against it, so the
         welcome intro renders identically. */
      .stage {
        position: relative;
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: var(--bone-white);
      }

      /* Empty dark placeholder below the hero — the expanded card flows seamlessly
         into it; the fixed navbar persists on top. */
      .section-2 {
        position: relative;
        width: 100%;
        height: 100vh;
        background: var(--ink);
      }

      /* (1) Background photo — hidden during the welcome, fades in with the hero. */
      .hero-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
        user-select: none;
      }

      /* (1b) Welcome ghost P-mark (the dull 20% mark bleeding off the TOP-RIGHT, as on
         the standalone welcome). Present during the welcome, fades out at the transition;
         the hero has its own different ghost on the card. Hidden in the resolved hero. */
      .welcome-ghost {
        position: absolute;
        top: 0;
        right: 0;
        height: 106.62%;
        width: auto;
        pointer-events: none;
        user-select: none;
        opacity: 0; /* hero (no-JS fallback) shows no welcome ghost */
      }

      /* (2) The dark hero card — centred, blooms from scale 0 at the transition.
         Centring is left/top 50% + a GSAP-native xPercent/yPercent so animating
         `scale` never fights the CSS translate. No logo lives inside it: the
         persistent .brand overlay is the logo. */
      .card {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        width: var(--card-w);
        aspect-ratio: 1034.69 / 672;
        background: var(--ink);
        overflow: hidden;
        will-change: transform; /* promote to a GPU layer so scaling the card (and
          its glow/ghost) composites instead of re-rasterising each frame */
      }

      /* (2a) Blue glow swoosh — sits behind the logo, bleeds past both card edges. */
      .glow {
        position: absolute;
        left: -14.55%;
        top: 2.23%;
        width: 129.37%;
        height: 82.5%;
        pointer-events: none;
        user-select: none;
      }

      /* (2b) Faint ghost P-mark — right edge, bleeds off-card (clipped). */
      .ghost {
        position: absolute;
        left: 78.96%;
        top: 6.7%;
        width: 39.91%;
        height: 91.93%;
        pointer-events: none;
        user-select: none;
      }

      /* (2c) Top nav — four links spread across ~90% width. */
      .nav {
        position: absolute;
        left: 5.17%;
        top: 5.36%;
        width: 89.69%;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .nav a {
        color: var(--bone-white);
        text-decoration: none;
        font-size: calc(var(--card-w) * 0.01933); /* 20px @ 1034.69 */
        font-weight: 400;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden; /* clip box: the inner span rises up from this baseline */
      }
      .nav a span {
        display: inline-block;
        will-change: transform;
      }

      /* (2d) "scroll" marquee strip — bottom Bone White rail with repeated `scroll |`. */
      .ticker {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 4.32%; /* 29 / 672 */
        background: var(--bone-white);
        overflow: hidden;
        display: flex;
        align-items: center;
      }
      .ticker__track {
        display: flex;
        flex-shrink: 0;
        gap: calc(var(--card-w) * 0.01643); /* 17px */
        padding-right: calc(var(--card-w) * 0.01643);
        color: #000;
        font-size: calc(var(--card-w) * 0.01353); /* 14px @ 1034.69 */
        font-weight: 500;
        white-space: nowrap;
        /* Infinite marquee: two identical tracks sit side by side and both slide
           left by exactly one track-width. When track 1 clears the viewport, track 2
           has taken its place, and the loop restart at 0% is seamless. */
        animation: ticker-scroll 52s linear infinite;
        will-change: transform;
      }
      .ticker__track span {
        flex-shrink: 0;
      }
      @keyframes ticker-scroll {
        from { transform: translateX(0); }
        to   { transform: translateX(-100%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .ticker__track { animation: none; }
      }

      /* ---- Scroll mechanic furniture (built at runtime, body-level FIXED so it
              persists into section 2 once the hero scrolls past) ---- */
      /* Persistent navbar — each link is individually fixed-positioned by JS: it
         starts overlaying the in-card nav, then spreads to the screen edges. */
      .navbar {
        position: fixed;
        inset: 0 auto auto 0;
        width: 100%;
        z-index: 5;
        pointer-events: none;
      }
      .navbar a {
        position: fixed;
        color: var(--bone-white);
        text-decoration: none;
        font-size: calc(var(--card-w) * 0.01933); /* matches the in-card nav at rest */
        font-weight: 400;
        letter-spacing: 0.01em;
        white-space: nowrap;
        overflow: hidden;
        pointer-events: auto;
        will-change: transform; /* pre-promote so the first scroll doesn't stall */
      }
      .navbar a span {
        display: inline-block;
      }
      /* Faint hairline surface under the navbar — fades in at the end of the scrub. */
      .navbar__hairline {
        position: fixed;
        left: 0;
        top: 56px;
        width: 100%;
        height: 1px;
        background: var(--hairline-track);
        opacity: 0;
        z-index: 5;
      }
      /* The flying P-mark — a standalone clone that travels to the navbar centre
         (the in-lockup mark is hidden once this exists). */
      .nav-mark {
        position: fixed;
        z-index: 6;
        overflow: visible;
        pointer-events: none;
        will-change: transform; /* smooth GPU-composited flight to the navbar */
      }

      /* (3) Persistent lockup overlay (welcome ⇄ hero pivot). Anchored so the lockup
         CENTRE lands at 60.5% of viewport height — identical to the hero's logo spot.
         Sits above the card; never moves or scales. */
      .brand {
        position: absolute;
        left: 50%;
        top: calc(60.5% - var(--lock-w) * 0.198);
        transform: translateX(-50%);
        width: var(--lock-w);
        display: flex;
        flex-direction: column;
        align-items: center;
        z-index: 2;
      }

      /* Inlined lockup (783 × 310). TWO stacked copies sit in .brand: an ink copy
         (welcome look) and a Bone-White copy (hero look), the latter cloned at runtime.
         The Bone-White copy overlays the ink one exactly and is revealed CLIPPED to the
         dark card's growing rectangle — so every pixel of the logo flips ink→Bone the
         instant the dark passes behind it, and the logo never drops below full contrast.
         Default fill is Bone White so the no-JS / reduced-motion fallback renders the
         resolved (hero) logo. */
      .lockup {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .lk-mark__stem,
      .lk-word {
        fill: var(--bone-white);
      }
      .lk-mark__blade {
        fill: var(--proxy-blue);
      }
      /* With JS, the ink copy carries the welcome colors (dark logo on bone white). */
      .js .lockup--ink .lk-mark__stem,
      .js .lockup--ink .lk-word {
        fill: var(--ink);
      }
      /* The Bone-White copy sits exactly over the ink copy (clipped to the card). */
      .lockup--light {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: auto;
        will-change: transform; /* promote the wiping wordmark layer up front */
      }

      /* (3a) Hairline loader (welcome only) — faint track + ink fill. Hidden in the
         resolved hero; the marquee takes its place. */
      .hairline {
        position: relative;
        width: 39.5%;
        height: 3px;
        margin-top: 5.9%;
        opacity: 0;
      }
      .hairline__track {
        position: absolute;
        left: 0;
        right: 0;
        top: 1px;
        height: 1px;
        background: var(--hairline-track);
      }
      .hairline__segment {
        position: absolute;
        left: 0.5%;
        top: 0;
        width: 32.4%;
        height: 3px;
        background: var(--ink);
        border-radius: 999px;
      }

      /* ---- Armed (welcome start) states — only when JS is present ----
         Hero furniture hidden, photo hidden, card collapsed, lockup in WELCOME
         colors (ink on bone white) with mark/glyphs hidden for the wipe, hairline
         shown as the loader. JS plays intro → transition; fallback drops .js → hero. */
      /* Lock scrolling while the intro plays; released (→ .scroll-ready) on intro
         complete, when the ScrollTrigger scroll mechanic is wired up. */
      html.js:not(.scroll-ready),
      html.js:not(.scroll-ready) body {
        overflow: hidden;
      }
      .js .hero-bg {
        opacity: 0;
      }
      .js .card {
        transform: scale(0); /* collapsed; GSAP owns the centred transform */
      }
      .js .glow,
      .js .ghost,
      .js .ticker {
        opacity: 0;
      }
      /* nav stays present; each link's text is parked below its own baseline and
         rises up — the same clip-mask reveal the welcome wordmark uses. */
      .js .nav a span {
        transform: translateY(110%);
      }
      .js .welcome-ghost {
        opacity: 1;
        clip-path: inset(100% 0% 0% 0%); /* armed: fully clipped; wipes up to reveal */
      }
      .js .hairline {
        opacity: 1;
      }
      .js .hairline__segment {
        width: 0;
      }
      .js .lockup--ink .lk-mark,
      .js .lockup--ink .lk-glyph {
        opacity: 0; /* hidden until the wipe reveals them (ink copy only) */
      }
    </style>
  </head>
  <body>

      <!-- (1) Background photo -->
      <img class="hero-bg" src="assets/hero-bg.webp" alt="" aria-hidden="true" />

      <!-- (1b) Welcome ghost P-mark, bleeding off the top-right -->
      <img
        class="welcome-ghost"
        src="assets/dullLogo.svg"
        alt=""
        aria-hidden="true"
      />

      <!-- (2) The dark hero card (no logo inside — the overlay is the logo) -->

            <path
              class="lk-glyph"
              d="M698.715 244.588H717.34C718.084 255.668 724.879 264.3 742.76 264.3C758.955 264.3 763.27 257.177 763.27 250.227C763.27 238.207 750.473 236.896 738.048 234.274C721.283 230.341 702.088 225.444 702.088 205.559C702.088 189.037 715.455 177.956 738.594 177.956C764.931 177.956 777.555 192.03 778.869 208.551H760.244C758.93 201.23 754.962 192.772 738.966 192.772C726.541 192.772 721.283 197.644 721.283 204.792C721.283 214.735 732.022 215.675 745.563 218.692C763.245 222.823 782.465 227.893 782.465 249.287C782.465 267.862 768.155 279.14 742.934 279.14C713.769 279.14 699.261 264.127 698.715 244.613V244.588Z"
            />
          </g>
        </svg>

        <div class="hairline" aria-hidden="true">
          <span class="hairline__track"></span>
          <span class="hairline__segment"></span>
        </div>
      </div>
    </main>

    <!-- Empty dark placeholder section (revealed after the hero transforms to full-bleed) -->
    <section class="section-2" aria-hidden="true"></section>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const root = document.documentElement;
        const SVGNS = "http://www.w3.org/2000/svg";
        const svg = document.querySelector(".lockup--ink");
        const prefersReduced = matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        // Fallback: no GSAP (CDN blocked) or reduced motion → resolved hero instantly
        // by dropping the armed (.js) rules.
        if (!window.gsap || prefersReduced) {
          root.classList.remove("js");
          return;
        }

        if (window.ScrollTrigger) gsap.registerPlugin(ScrollTrigger);

        // ---- Stacked Bone-White copy of the logo --------------------------
        // Clone the ink lockup (before the wipe wraps its paths) into a Bone-White copy
        // laid exactly over it. We reveal this copy clipped to the dark card's growing
        // rect, so the logo flips ink→Bone in lockstep with the dark arriving behind it
        // and is never lower-contrast — it stays fully visible throughout the transition.
        const lightSvg = svg.cloneNode(true);
        lightSvg.classList.remove("lockup--ink");
        lightSvg.classList.add("lockup--light");
        lightSvg.setAttribute("aria-hidden", "true");
        lightSvg.removeAttribute("aria-label");
        svg.parentNode.insertBefore(lightSvg, svg.nextSibling);
        // Start fully hidden (transparent mask) until the transition reveals it.
        const HIDDEN_MASK = "linear-gradient(rgba(0,0,0,0), rgba(0,0,0,0))";
        lightSvg.style.webkitMaskImage = HIDDEN_MASK;
        lightSvg.style.maskImage = HIDDEN_MASK;

        // ---- Per-element mask wipe (welcome intro) ----------------------
        // Each glyph / mark-half is wrapped in a <g clip-path> whose rect bottom
        // sits on the element's own base; the element starts below that base
        // (hidden) and slides up — unveiled from its own axis base. Crisp, no fade.
        const PAD_X = 2;
        const PAD_TOP = 6;
        const riseOf = new Map(); // ink copy (welcome reveal)
        const riseOfLight = new Map(); // light copy (scroll exit wipe)
        let clipN = 0;

        // Per-copy <defs> factory.
        const defsFor = (rootSvg) => {
          let d = rootSvg.querySelector("defs");
          if (!d) {
            d = document.createElementNS(SVGNS, "defs");
            rootSvg.insertBefore(d, rootSvg.firstChild);
          }
          return d;
        };
        const defs = defsFor(svg);

        // Wrap one path in a clip-<g> whose rect bottom sits on the path's base, and
        // record its rise distance. Reused for BOTH copies (clipN keeps IDs unique).
        const wrap = (path, defsEl, riseMap) => {
          const bb = path.getBBox();
          const id = "ppclip-" + clipN++;
          const cp = document.createElementNS(SVGNS, "clipPath");
          cp.setAttribute("id", id);
          cp.setAttribute("clipPathUnits", "userSpaceOnUse");
          const rect = document.createElementNS(SVGNS, "rect");
          rect.setAttribute("x", bb.x - PAD_X);
          rect.setAttribute("y", bb.y - PAD_TOP);
          rect.setAttribute("width", bb.width + PAD_X * 2);
          rect.setAttribute("height", bb.height + PAD_TOP);
          cp.appendChild(rect);
          defsEl.appendChild(cp);

          const g = document.createElementNS(SVGNS, "g");
          g.setAttribute("clip-path", "url(#" + id + ")");
          path.parentNode.insertBefore(g, path);
          g.appendChild(path);

          riseMap.set(path, bb.height + PAD_TOP);
        };

        // Scope every intro query to the INK copy so the Bone-White clone is left
        // fully assembled (it only needs to be revealed by the clip later).
        const stem = svg.querySelector(".lk-mark__stem");
        const blade = svg.querySelector(".lk-mark__blade");
        const proxy = gsap.utils.toArray(
          svg.querySelectorAll('[data-word="proxy"] .lk-glyph'),
        );
        const papers = gsap.utils.toArray(
          svg.querySelectorAll('[data-word="papers"] .lk-glyph'),
        );
        const glyphs = [...proxy, ...papers];
        [stem, blade, ...glyphs].forEach((p) => wrap(p, defs, riseOf));

        // Wrap the VISIBLE (light) copy's wordmark glyphs too, so the scroll mechanic
        // can wipe them out with the same clip — reversed (slide DOWN past their base).
        // The light glyphs rest assembled at y:0; only the wordmark needs this (the
        // light mark is handled by the flying nav-mark clone, not a wipe).
        const defsLight = defsFor(lightSvg);
        const lightGlyphs = gsap.utils.toArray(
          lightSvg.querySelectorAll('[data-word] .lk-glyph'),
        );
        lightGlyphs.forEach((p) => wrap(p, defsLight, riseOfLight));

        // Clips now hide everything; opacity stays on (the wipe reveals).
        gsap.set(svg.querySelector(".lk-mark"), { opacity: 1 });
        gsap.set([stem, blade, ...glyphs], {
          opacity: 1,
          y: (i, t) => riseOf.get(t),
        });

        // Card: centre via GSAP-native percent translate, start collapsed.
        const cardEl = document.querySelector(".card");
        gsap.set(cardEl, {
          x: 0,
          y: 0,
          xPercent: -50,
          yPercent: -50,
          scale: 0,
          transformOrigin: "center center",
        });

        // Reveal the Bone-White copy masked to the dark card's current on-screen rect:
        // bone shows wherever the card is behind the logo, ink everywhere else. Instead
        // of a hard clip edge, two intersecting gradient masks (H + V) give each card
        // edge a soft FEATHER band, so the ink→bone flip is a gradient rather than a
        // line. The opaque stop sits exactly on the card edge and the falloff sits just
        // outside it, so full coverage (insets 0) stays fully bone. Driven each frame
        // from the card's growth, so the recolor tracks the dark edge.
        const FEATHER = 3; // feather band width, % of the logo box
        // The logo box is static through the transition, so measure it once and
        // cache it — avoids a second forced layout (getBoundingClientRect) every
        // frame while the card blooms.
        let lRect = null;
        const syncLightClip = () => {
          const c = cardEl.getBoundingClientRect();
          const l = lRect || (lRect = lightSvg.getBoundingClientRect());
          if (!l.width || !l.height) return;
          const top = Math.max(0, ((c.top - l.top) / l.height) * 100);
          const right = Math.max(0, ((l.right - c.right) / l.width) * 100);
          const bottom = Math.max(0, ((l.bottom - c.bottom) / l.height) * 100);
          const left = Math.max(0, ((c.left - l.left) / l.width) * 100);
          const F = FEATHER;
          const mh =
            `linear-gradient(to right, transparent ${left - F}%, #000 ${left}%, ` +
            `#000 ${100 - right}%, transparent ${100 - right + F}%)`;
          const mv =
            `linear-gradient(to bottom, transparent ${top - F}%, #000 ${top}%, ` +
            `#000 ${100 - bottom}%, transparent ${100 - bottom + F}%)`;
          lightSvg.style.webkitMaskImage = `${mh}, ${mv}`;
          lightSvg.style.maskImage = `${mh}, ${mv}`;
          lightSvg.style.webkitMaskComposite = "source-in"; // = intersect (WebKit)
          lightSvg.style.maskComposite = "intersect";
        };

        // ---- Master timeline: intro + loader (t0) → transition (t=5) ----
        const STAG = 0.06;
        const T = 1.8; // transition fires the moment the logo reveal + loader complete
        // Paused until assets are ready (see the gate at the end) — otherwise the
        // first-load font reflow + PNG decode land mid-reveal and stutter.
        const tl = gsap.timeline({ defaults: { ease: "power3.out" }, paused: true });

        // Welcome ghost wipes up from its base — a giant, slower echo of the mark's
        // own reveal, establishing the ground the wordmark then assembles onto.
        tl.to(
          ".welcome-ghost",
          { clipPath: "inset(0% 0% 0% 0%)", duration: 1.3, ease: "power3.out" },
          0,
        );

        // Welcome intro — mark leads, then Proxy, then Papers.
        tl.to([stem, blade], { y: 0, duration: 0.7, stagger: 0.14 }, 0.2)
          .to(proxy, { y: 0, duration: 0.7, stagger: STAG }, 0.5)
          .to(papers, { y: 0, duration: 0.7, stagger: STAG }, 0.78);

        // Hairline loader — fills in step with the logo reveal (both finish at ~T),
        // so the welcome is exactly as long as the logo takes to assemble.
        tl.fromTo(
          ".hairline__segment",
          { width: "0%" },
          { width: "100%", duration: T, ease: "none" },
          0,
        );

        // ---- Transition: the environment blooms around the fixed logo -----
        tl.to(".hero-bg", { opacity: 1, duration: 0.9, ease: "power2.out" }, T)
          // dark card grows from centre, behind the logo; each frame the Bone-White
          // copy is re-clipped to the card so the recolor tracks the dark edge exactly
          .to(
            cardEl,
            {
              scale: 1,
              duration: 1.2,
              ease: "power3.out",
              onUpdate: syncLightClip,
              onComplete: syncLightClip,
            },
            T,
          )
          // the welcome furniture (loader + ghost) gives way
          .to(".hairline", { opacity: 0, duration: 0.4, ease: "power1.out" }, T)
          .to(".welcome-ghost", { opacity: 0, duration: 0.6, ease: "power1.out" }, T)
          // hero furniture settles in around the logo
          .to(
            [".glow", ".ghost", ".ticker"],
            { opacity: 1, duration: 0.7, stagger: 0.08, ease: "power2.out" },
            T + 0.6,
          )
          // nav links rise from their baseline — the welcome wordmark's reveal,
          // applied per link (same ease/duration/stagger feel). GSAP reads the
          // armed CSS translateY(110%) as the start; we animate it back to 0.
          .to(
            ".nav a span",
            { y: 0, yPercent: 0, duration: 0.7, stagger: STAG, ease: "power3.out" },
            T + 0.6,
          );

        window.__experienceTL = tl; // exposed for testing / scrubbing

        // ============================================================
        //  SCROLL MECHANIC — hero dissolves into the dark site canvas.
        //  Built once the intro resolves, so the timed intro and the
        //  scrubbed scroll never fight, and the page can't scroll early.
        // ============================================================
        const cardEl2 = document.querySelector(".card");
        const tickerEl = document.querySelector(".ticker");
        const inCardNav = document.querySelector(".nav");
        const lightMark = lightSvg.querySelector(".lk-mark");
        const inkMark = svg.querySelector(".lk-mark");
        const NAV_Y = 32; // navbar vertical centre, px from viewport top

        const setupScroll = () => {
          if (!window.ScrollTrigger) return;

          // Smooth scroll (Lenis). Driven off GSAP's ticker (single rAF loop) and
          // wired to ScrollTrigger.update so the pinned scrub stays perfectly in
          // sync. This is what closes the Chrome↔Firefox smoothness gap.
          if (window.Lenis) {
            const lenis = new Lenis({ lerp: 0.1 });
            lenis.on("scroll", ScrollTrigger.update);
            gsap.ticker.add((time) => lenis.raf(time * 1000));
            gsap.ticker.lagSmoothing(0);
            window.__lenis = lenis;
          }

          // --- (a) Standalone nav-mark clone (bone stem + blue blade) ---------
          const navMark = document.createElementNS(SVGNS, "svg");
          navMark.setAttribute("viewBox", "0 0 184.958 276.692");
          navMark.setAttribute("class", "nav-mark");
          navMark.setAttribute("aria-hidden", "true");
          lightMark.querySelectorAll("path").forEach((p) =>
            navMark.appendChild(p.cloneNode(true)),
          );
          document.body.appendChild(navMark);

          // --- (b) Persistent fixed navbar links (cloned from in-card nav) -----
          const navbar = document.createElement("nav");
          navbar.className = "navbar";
          navbar.setAttribute("aria-label", "Proxy Papers");
          const srcLinks = [...inCardNav.querySelectorAll("a")];
          const links = srcLinks.map((a) => {
            const el = document.createElement("a");
            el.href = "#";
            el.innerHTML = "<span>" + a.textContent.trim() + "</span>";
            navbar.appendChild(el);
            return el;
          });
          const hairline = document.createElement("div");
          hairline.className = "navbar__hairline";
          document.body.appendChild(navbar);
          document.body.appendChild(hairline);

          // Capture rest geometry ONCE, before the pin is created. Pinning
          // momentarily reflows the in-card nav, so re-measuring it later (on
          // refresh) yields values shifted by the pin offset — which is exactly
          // what desynced the links from the mark. Constants keep them in lockstep.
          const restMark = lightMark.getBoundingClientRect();
          const restLinks = srcLinks.map((s) => s.getBoundingClientRect());

          // In-card nav steps aside (kept in layout); the fixed links overlay it
          // exactly at rest, so the swap is invisible.
          gsap.set(inCardNav, { autoAlpha: 0 });
          // Hide the ENTIRE ink copy. Once the bone wordmark wipes away, the ink
          // copy's ink-coloured glyphs would otherwise show as a dark "shadow"
          // against the blue glow behind the logo. From here we only need the light
          // copy (its wordmark wipes; its mark is replaced by the flying nav-mark).
          gsap.set(svg, { opacity: 0 });
          gsap.set(lightMark, { opacity: 0 });
          // The feathered recolor mask has done its job (welcome→hero). Beyond rest
          // the logo always sits on the dark card, so the mask is now a static
          // full-coverage no-op — but it still forces the browser to re-rasterise the
          // masked layer on the FIRST animated frame, which is the "first scroll hides
          // the text instantly" stall. Drop it; the light copy is plain bone from here.
          lightSvg.style.webkitMaskImage = "none";
          lightSvg.style.maskImage = "none";

          // ---- Rest placement (re-applied on refresh; CSS left/top aren't ST-managed) ----
          const placeAtRest = () => {
            gsap.set(navMark, {
              left: restMark.left,
              top: restMark.top,
              width: restMark.width,
              height: restMark.height,
              x: 0,
              y: 0,
              scale: 1,
              transformOrigin: "center center",
            });
            restLinks.forEach((r, i) => {
              gsap.set(links[i], { left: r.left, top: r.top, x: 0, y: 0 });
            });
          };

          // ---- Target geometry (from the captured rest constants) ----
          const markTarget = () => ({
            scale: 30 / restMark.height, // ~30px tall in the navbar
            x: window.innerWidth / 2 - (restMark.left + restMark.width / 2),
            y: NAV_Y - (restMark.top + restMark.height / 2),
          });
          const linkTargets = () => {
            const vw = window.innerWidth;
            const pad = vw * 0.0517; // matches the card nav inset
            const GAP = Math.max(24, vw * 0.018);
            const w = restLinks.map((r) => r.width);
            const L = [];
            L[0] = pad; // Approach — hard left
            L[1] = pad + w[0] + GAP; // Services — beside it
            L[3] = vw - pad - w[3]; // Contact — hard right
            L[2] = L[3] - GAP - w[2]; // Referrers — beside it
            return restLinks.map((r, i) => ({
              x: L[i] - r.left,
              y: NAV_Y - r.height / 2 - r.top,
            }));
          };

          placeAtRest();
          ScrollTrigger.addEventListener("refreshInit", placeAtRest);

          // ---- The scrubbed transformation timeline ----
          const stl = gsap.timeline({
            // force3D emits matrix3d transforms → every animated element gets its
            // own GPU compositor layer. On Firefox this moves the layer allocation
            // off the first scroll frame (the "first-time-only" jank).
            defaults: { ease: "power3.inOut", force3D: true },
            scrollTrigger: {
              trigger: ".stage",
              start: "top top",
              end: "+=150%", // 1.5 viewports — longer, more deliberate
              pin: true,
              scrub: 1, // smoothing catch-up — glides between scroll positions
              // instead of snapping to raw wheel deltas (kills the "skipped frames"
              // jitter); also de-janks the card scale via GPU layers (will-change)
              invalidateOnRefresh: true,
            },
          });

          // 1. Wordmark wipes out — light glyphs slide DOWN past their base (reverse
          //    of the welcome reveal), clipping away.
          stl.to(
            lightGlyphs,
            {
              y: (i, t) => riseOfLight.get(t),
              ease: "power2.in",
              duration: 0.4,
              stagger: 0.012,
            },
            0,
          );

          // 2. Ticker fades; the card's expansion carries it off the bottom edge.
          stl.to(tickerEl, { opacity: 0, duration: 0.25, ease: "power1.out" }, 0);

          // 3. Dark card expands to full-bleed (non-uniform; offset* is the
          //    transform-independent layout size). glow + ghost ride along.
          stl.to(
            cardEl2,
            {
              scaleX: () => window.innerWidth / cardEl2.offsetWidth,
              scaleY: () => window.innerHeight / cardEl2.offsetHeight,
              duration: 0.9,
            },
            0.1,
          );

          // 4. The P-mark shrinks and flies to the navbar centre.
          stl.to(
            navMark,
            {
              x: () => markTarget().x,
              y: () => markTarget().y,
              scale: () => markTarget().scale,
              duration: 0.7,
            },
            0.3,
          );

          // 5. Nav links spread to the screen edges (clearing the centre).
          links.forEach((el, i) => {
            stl.to(
              el,
              {
                x: () => linkTargets()[i].x,
                y: () => linkTargets()[i].y,
                duration: 0.7,
              },
              0.3,
            );
          });

          // 6. Faint navbar hairline settles in at the end.
          stl.to(hairline, { opacity: 1, duration: 0.25, ease: "power1.out" }, 0.78);

          window.__scrollTL = stl; // exposed for testing
          ScrollTrigger.refresh();

          // Warm-up: render the end state once (suppressing callbacks) then reset, so
          // the GPU layers, SVG clips and the full-bleed card scale are all primed
          // before the first real scroll — no first-frame stall.
          stl.progress(1, true);
          stl.progress(0, true);
          void document.body.offsetHeight; // force the style/layout flush
        };

        // Release the scroll lock and wire the mechanic once the intro resolves.
        tl.eventCallback("onComplete", () => {
          document.body.classList.add("is-dark");
          root.classList.add("scroll-ready");
          setupScroll();
        });

        // ---- Asset gate: only start the reveal once fonts are ready and every
        // image is DECODED (not just downloaded). This keeps the first-load font
        // reflow and the 1280×714 hero-bg PNG decode off the animation frames —
        // the root cause of the "everything stutters on first load" jank. A 1.2s
        // cap guarantees the reveal never hangs on a slow/missing asset. ----
        const assetsReady = Promise.all([
          document.fonts ? document.fonts.ready : Promise.resolve(),
          ...[...document.images].map((img) =>
            img.decode ? img.decode().catch(() => {}) : Promise.resolve(),
          ),
        ]);
        const cap = new Promise((r) => setTimeout(r, 1200));
        Promise.race([assetsReady, cap]).then(() => tl.play());
      });
    </script>
  </body>
</html>
