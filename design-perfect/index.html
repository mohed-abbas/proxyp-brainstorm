<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Proxy Papers — Welcome</title>

    <!-- Mark the document as JS-capable BEFORE first paint, so we can safely hide
       the animated-in pieces without ever flashing the full logo. If JS is off,
       these rules never apply and the logo renders normally. -->
    <script>
      document.documentElement.classList.add("js");
    </script>

    <!-- GSAP (CDN) -->
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"
      defer
    ></script>

    <style>
      :root {
        /* Brand palette */
        --bone-white: #f7f4f0; /* warm off-white ground */
        --ink: #161718; /* Chinese Black */
        --proxy-blue: #5a90f4; /* accent — lives inside the lockup SVG */
        --hairline-track: #b9b9b9;

        /* Lockup is the single scaling unit; everything else is derived from it.
         At a 1512px-wide design frame, 51.75vw ≈ 782.5px ≈ the Figma lockup. */
        --lock-w: clamp(280px, 51.75vw, 783px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
      }

      body {
        background: var(--bone-white);
        overflow: hidden;
        font-family:
          "PP Neue Montreal", "Neue Haas Grotesk", "Inter", system-ui,
          sans-serif;
      }

      /* Full-viewport welcome canvas (Figma frame: 1512 × 982) */
      .stage {
        position: fixed;
        inset: 0;
        overflow: hidden;
        background: var(--bone-white);
      }

      /* (1) Dull ghost P-mark (Figma node 1:3, 661×1047, 20% opacity #404243).
       Anchored flush to the TOP-RIGHT; it is taller than the frame (1047 / 982 ≈
       106.6%) so it bleeds ~65px off the bottom. width:auto keeps the 661:1047
       aspect, landing its left edge at ~56.3% — matching Figma's x≈852. */
      .ghost-mark {
        position: absolute;
        top: 0;
        right: 0;
        height: 106.62%;
        width: auto;
        pointer-events: none;
        user-select: none;
      }

      /* (2)+(3) Lockup + hairline accent.
       Figma centres the *lockup* at 60.5% of the frame height (nudged below middle),
       with the hairline hanging below it. We anchor the lockup's TOP so its centre
       lands at 60.5% regardless of the hairline: top = 60.5% − (lockupHeight / 2),
       where lockupHeight = lock-w / 2.5266 (the 783×310 aspect) ⇒ ×0.198. */
      .brand {
        position: absolute;
        left: 50%;
        top: calc(60.5% - var(--lock-w) * 0.198);
        transform: translateX(-50%);
        width: var(--lock-w);
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* (2) Inlined logo lockup (783 × 310): blue+ink P-mark + "Proxy Papers".
       Inlined (not <img>) so GSAP can target each glyph <path>. */
      .lockup {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible; /* let glyphs rise in without clipping at the edges */
      }

      /* (3) Hairline accent — Figma node 1:24:
       faint 309px track (#B9B9B9, 1px) + 100px ink segment (#161718, 3px, round cap). */
      .hairline {
        position: relative;
        width: 39.5%;
        height: 3px;
        margin-top: 5.9%;
      }
      .hairline__track {
        position: absolute;
        left: 0;
        right: 0;
        top: 1px;
        height: 1px;
        background: var(--hairline-track);
      }
      .hairline__segment {
        position: absolute;
        left: 0.5%;
        top: 0;
        width: 32.4%; /* 100 / 309 */
        height: 3px;
        background: var(--ink);
        border-radius: 999px;
      }

      /* ---- Armed (pre-animation) states — only when JS is present ----
         The mark fades in; glyphs are hidden until JS clips + slides them up;
         the hairline track is a static rail and the segment is the loader fill,
         which starts empty (width 0) and fills over 5s. */
      .js .lk-mark,
      .js .lk-glyph {
        opacity: 0;
      }
      .js .hairline__segment {
        width: 0;
      }
    </style>
  </head>
  <body>
    <main class="stage" role="img" aria-label="Proxy Papers">
      <!-- (1) Ghost P-mark, bleeding off the top-right -->
      <img
        class="ghost-mark"
        src="assets/dullLogo.svg"
        alt=""
        aria-hidden="true"
      />

      <!-- (2) Centred lockup (inlined) + (3) hairline accent -->

        </svg>

        <div class="hairline" aria-hidden="true">
          <span class="hairline__track"></span>
          <span class="hairline__segment"></span>
        </div>
      </div>
    </main>

    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const root = document.documentElement;
        const SVGNS = "http://www.w3.org/2000/svg";
        const svg = document.querySelector(".lockup");
        const prefersReduced = matchMedia(
          "(prefers-reduced-motion: reduce)",
        ).matches;

        // Fallback: no GSAP (CDN blocked) or reduced motion → show the static
        // design state instantly by dropping the armed (.js) rules.
        if (!window.gsap || prefersReduced) {
          root.classList.remove("js");
          return;
        }

        // ---- Per-letter mask wipe ----------------------------------------
        // Each glyph is wrapped in a <g clip-path> whose rect matches the glyph's
        // OWN bounding box, with the bottom edge sitting exactly on the glyph's
        // base. The glyph starts pushed fully below that base (hidden by the clip)
        // and slides up into view — so every letter is unveiled from its own axis
        // base, not a shared page baseline. Crisp, no fade.
        let defs = svg.querySelector("defs");
        if (!defs) {
          defs = document.createElementNS(SVGNS, "defs");
          svg.insertBefore(defs, svg.firstChild);
        }
        const PAD_X = 2; // breathing room so sides aren't clipped at full reveal
        const PAD_TOP = 6; // ... and the top isn't clipped either
        const riseOf = new Map(); // el -> distance to start below its base
        let clipN = 0; // shared id counter so mark halves + glyphs never collide

        const wrap = (path) => {
          const bb = path.getBBox();
          const id = "ppclip-" + clipN++;
          const cp = document.createElementNS(SVGNS, "clipPath");
          cp.setAttribute("id", id);
          cp.setAttribute("clipPathUnits", "userSpaceOnUse");
          const rect = document.createElementNS(SVGNS, "rect");
          rect.setAttribute("x", bb.x - PAD_X);
          rect.setAttribute("y", bb.y - PAD_TOP);
          rect.setAttribute("width", bb.width + PAD_X * 2);
          rect.setAttribute("height", bb.height + PAD_TOP); // bottom stays on the base
          cp.appendChild(rect);
          defs.appendChild(cp);

          const g = document.createElementNS(SVGNS, "g");
          g.setAttribute("clip-path", "url(#" + id + ")");
          path.parentNode.insertBefore(g, path);
          g.appendChild(path);

          riseOf.set(path, bb.height + PAD_TOP); // start fully below the clip
        };

        // The P-mark's two halves wipe up from their OWN bases too (stem, then
        // the blue blade) — same mechanic as the letters.
        const stem = svg.querySelector(".lk-mark__stem");
        const blade = svg.querySelector(".lk-mark__blade");
        const proxy = gsap.utils.toArray('[data-word="proxy"] .lk-glyph');
        const papers = gsap.utils.toArray('[data-word="papers"] .lk-glyph');
        const glyphs = [...proxy, ...papers];
        [stem, blade, ...glyphs].forEach(wrap);

        // The clips now hide everything, so opacity stays on (the wipe reveals).
        gsap.set(".lk-mark", { opacity: 1 }); // undo the .js pre-paint flash guard
        gsap.set([stem, blade, ...glyphs], { opacity: 1, y: (i, t) => riseOf.get(t) });

        // ---- Logo reveal timeline (mark leads → Proxy → Papers) ----------
        const STAG = 0.06;
        const tl = gsap.timeline({ defaults: { ease: "power3.out" } });
        tl.to([stem, blade], { y: 0, duration: 0.7, stagger: 0.14 }, 0.2) // stem→blade
          .to(proxy, { y: 0, duration: 0.7, stagger: STAG }, 0.5)
          .to(papers, { y: 0, duration: 0.7, stagger: STAG }, 0.78);

        window.__welcomeTL = tl; // exposed for testing / scrubbing

        // ---- Standalone hairline loader (5s, independent of the logo) -----
        // The track is the static rail; the ink segment fills it over 5 seconds.
        gsap.set(".hairline__segment", { width: "0%" });
        window.__loader = gsap.to(".hairline__segment", {
          width: "100%",
          duration: 5,
          ease: "none",
        });
      });
    </script>
  </body>
</html>
