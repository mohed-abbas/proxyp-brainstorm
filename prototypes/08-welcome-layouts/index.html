<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Proxy Papers — Welcome / Layouts (prototype)</title>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
  <link href="https://api.fontshare.com/v2/css?f[]=general-sans@200,300,400,500,600,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-layout="centered">
  <div class="bg-depth" aria-hidden="true"></div>
  <div class="bg-grain" aria-hidden="true"></div>

  <!-- the welcome composition; data-layout on <body> drives the arrangement -->
  <main class="welcome" id="welcome">
    <div class="w-brand" id="brand">
      <svg class="mark" viewBox="0 0 110 120" aria-hidden="true"><rect class="mark-stem" x="26" y="16" width="22" height="90" rx="11"/><path class="mark-blade" d="M46 20 L92 20 Q100 20 96 29 L64 64 Q57 71 50 67 L46 63 Z"/></svg>
      <span class="w-word">Proxy&nbsp;Papers</span>
    </div>
    <p class="w-tag" id="tag">Un conseiller dédié.<br/>Une technologie souveraine.</p>
    <p class="w-eyebrow" id="eyebrow">Gestion privée des données — pionnier depuis 2016</p>
    <div class="w-cue" id="cue"><span>Entrer</span>
      <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 4v15m0 0l-6-6m6 6l6-6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
  </main>

  <!-- controls -->
  <div class="switcher" role="tablist" aria-label="Disposition">
    <button data-set="centered" class="is-active" type="button">Centré</button>
    <button data-set="editorial" type="button">Éditorial</button>
    <button data-set="split" type="button">Scindé</button>
    <button data-set="anchored" type="button">Ancré</button>
  </div>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Basculer le thème">
    <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 4a8 8 0 0 0 0 16z" fill="currentColor"/></svg>
  </button>

  <script src="script.js"></script>
</body>
</html>
